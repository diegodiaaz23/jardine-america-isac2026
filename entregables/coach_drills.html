<title>Coach Drills América</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: una sola columna tipo libreta de banca. Cada drill es una tarjeta con situación, cifras, decisión y revelado de evidencia. */
:root {
  --bg: #F2F4F8;
  --surface: #FFFFFF;
  --surface-2: #E9EDF4;
  --fg: #0D1A2D;
  --muted: #55637A;
  --line: #CFD6E2;
  --navy: #0B2F6B;
  --navy-fg: #FFFFFF;
  --gold: #E8A800;
  --gold-soft: #FFF1C2;
  --ok: #1B6B45;
  --ok-soft: #DDF1E6;
  --warn: #8A5A00;
  --warn-soft: #FFEBC7;
  --bad: #A5322A;
  --bad-soft: #F8DEDB;
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1322; --surface: #111E35; --surface-2: #192A47; --fg: #E8EDF6; --muted: #94A2BA; --line: #26385A;
    --navy: #7DA7FF; --navy-fg: #0A1322; --gold: #F5C518; --gold-soft: #3A3010;
    --ok: #62D39A; --ok-soft: #12382A; --warn: #F2B84B; --warn-soft: #3A2A0C; --bad: #FF8A80; --bad-soft: #3F1A18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1322; --surface: #111E35; --surface-2: #192A47; --fg: #E8EDF6; --muted: #94A2BA; --line: #26385A;
  --navy: #7DA7FF; --navy-fg: #0A1322; --gold: #F5C518; --gold-soft: #3A3010;
  --ok: #62D39A; --ok-soft: #12382A; --warn: #F2B84B; --warn-soft: #3A2A0C; --bad: #FF8A80; --bad-soft: #3F1A18;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: .01em; text-wrap: balance; margin: 0; line-height: 1.05; }
h1 { font-size: clamp(2.2rem, 7vw, 3.1rem); }
h2 { font-size: 1.7rem; }
h3 { font-size: 1.15rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
p { margin: 0; }
.eyebrow { font-family: var(--f-data); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.timer { font-family: var(--f-data); font-variant-numeric: tabular-nums; text-align: right; min-width: 0; }
.timer b { font-size: 1.9rem; font-weight: 500; display: block; line-height: 1; }
.timer span { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.timer.over b { color: var(--bad); }
.steps { display: flex; gap: 6px; }
.steps i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.steps i.done { background: var(--navy); }
.steps i.now { background: var(--gold); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.situation { font-size: 1.12rem; font-weight: 500; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { background: var(--surface-2); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat span { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.stat b { font-family: var(--f-data); font-weight: 500; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.question { font-family: var(--f-display); font-size: 1.5rem; font-weight: 600; line-height: 1.15; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  font: inherit; text-align: left; color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px;
  padding: 12px 14px; cursor: pointer; display: flex; gap: 12px; align-items: baseline; min-height: 48px;
}
.opt kbd { font-family: var(--f-data); font-size: .8rem; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; flex: none; }
.opt:hover:not(:disabled) { border-color: var(--navy); }
.opt:focus-visible, .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.opt:disabled { cursor: default; }
.opt.picked { border-color: var(--navy); background: var(--surface-2); }
.btn {
  font: inherit; font-weight: 600; background: var(--navy); color: var(--navy-fg); border: 0; border-radius: 8px; padding: 12px 20px;
  cursor: pointer; align-self: flex-start; min-height: 48px;
}
.btn.ghost { background: transparent; color: var(--fg); border: 1.5px solid var(--line); }
.reveal { display: flex; flex-direction: column; gap: 16px; border-top: 1px dashed var(--line); padding-top: 16px; }
.reveal[hidden] { display: none; }
.verdict { display: inline-flex; gap: 8px; align-items: center; font-weight: 600; padding: 6px 12px; border-radius: 6px; align-self: flex-start; font-size: .95rem; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.sin { background: var(--warn-soft); color: var(--warn); }
.verdict.no { background: var(--bad-soft); color: var(--bad); }
.ctx { display: flex; flex-direction: column; gap: 6px; }
.ctx h3 { margin: 0; }
.ctx .tw { overflow-x: auto; }
.ctx table { border-collapse: collapse; width: 100%; font-size: .86rem; font-variant-numeric: tabular-nums; }
.ctx th, .ctx td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.ctx th:first-child, .ctx td:first-child { text-align: left; }
.ctx th { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; }
.ctx td.lo { color: var(--bad, #A5322A); font-weight: 600; }
.block { display: flex; flex-direction: column; gap: 6px; }
.block p { max-width: 65ch; }
.probbar { display: flex; height: 30px; border-radius: 6px; overflow: hidden; font-family: var(--f-data); font-size: .8rem; font-variant-numeric: tabular-nums; }
.probbar div { display: flex; align-items: center; justify-content: center; color: #fff; min-width: 0; overflow: hidden; }
.pb-g { background: #1B6B45; } .pb-e { background: #6B7788; } .pb-p { background: #A5322A; }
.ci { position: relative; height: 54px; margin: 6px 0 2px; }
.ci .axis { position: absolute; left: 0; right: 0; top: 24px; height: 2px; background: var(--line); }
.ci .zero { position: absolute; top: 10px; bottom: 6px; width: 2px; background: var(--fg); left: 50%; }
.ci .range { position: absolute; top: 20px; height: 10px; border-radius: 5px; background: var(--gold); }
.ci .pt { position: absolute; top: 16px; width: 4px; height: 18px; background: var(--navy); border-radius: 2px; }
.ci .lbl { position: absolute; top: 38px; font-family: var(--f-data); font-size: .72rem; color: var(--muted); transform: translateX(-50%); white-space: nowrap; }
.ci .lbl.z { top: -4px; color: var(--fg); }
.note { font-size: .88rem; color: var(--muted); max-width: 65ch; }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cmp .stat b { font-size: 1.3rem; }
.sum-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.list { margin: 0; padding-left: 1.1rem; display: flex; flex-direction: column; gap: 6px; max-width: 65ch; }
.foot { font-size: .8rem; color: var(--muted); font-family: var(--f-data); }
@media (prefers-reduced-motion: no-preference) { .reveal { animation: in .25s ease-out; } @keyframes in { from { opacity: 0; transform: translateY(6px); } } }
</style>

<div class="wrap" id="app"></div>

<script>
var LIMIT = 240;
var BANK = [

  var lo = -24.2, hi = 11.6, pt = -5.8, mn = -30, mx = 30;

    '<div class="ci" role="img" aria-label="Efecto emparejado -5.8 puntos porcentuales, intervalo 95% de -24.2 a 11.6"><div class="axis"></div><div class="zero"></div><div class="range" style="left:' + pos(lo) + ';width:' + ((hi - lo) / (mx - mn) * 100).toFixed(2) + '%"></div><div class="pt" style="left:' + pos(pt) + '"></div>' +
    '<span class="lbl z" style="left:50%">0</span><span class="lbl" style="left:' + pos(lo) + '">−24.2</span><span class="lbl" style="left:' + pos(hi) + '">+11.6</span></div>' +
    '<p class="note">Intervalo de confianza al 95% (bootstrap, 2000 remuestreos). Incluye el cero: no hay evidencia de efecto en ningún sentido. Se probaron 5 combinaciones de ventanas y en las cinco el intervalo incluye el cero.</p></div>';
}
function causalLimits() {
  return '<div class="block"><h3>Límites</h3><p class="note">Pocos eventos (27 con cambio), cambios planificados mezclados con reactivos, sin control por fuerza del rival ni tarjetas.</p></div>';
}

/* Cada vez que se pulsa Comenzar se sortea un escenario de cada tipo del banco (12 en total) */
var KINDS = ["descanso", "gol", "balon", "expulsion"], DRILLS = [], lastPick = {};
function pickRun() {
  DRILLS = KINDS.map(function (k) {
    var pool = BANK.filter(function (d) { return d.kind === k; });
    var fresh = pool.filter(function (d) { return d.id !== lastPick[k]; });
    var d = (fresh.length ? fresh : pool)[Math.floor(Math.random() * (fresh.length ? fresh.length : pool.length))];
    lastPick[k] = d.id; return d;
  });
}
pickRun();

var state = { i: -1, answers: [], t0: 0, tick: null, elapsed: 0, locked: false };
var app = document.getElementById("app");

function fmt(s) { var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }
function steps() {
  var h = '<div class="steps" aria-hidden="true">';
  for (var k = 0; k < DRILLS.length; k++) h += '<i class="' + (k < state.answers.length ? "done" : (k === state.i ? "now" : "")) + '"></i>';
  return h + "</div>";
}
function timerHtml() {
  var over = state.elapsed > LIMIT;
  return '<div class="timer' + (over ? " over" : "") + '" id="timer"><b>' + fmt(state.elapsed) + '</b><span>de ' + fmt(LIMIT) + ' sugeridos</span></div>';
}
function startTimer() {
  state.t0 = Date.now() - state.elapsed * 1000;
  clearInterval(state.tick);
  state.tick = setInterval(function () {
    state.elapsed = Math.floor((Date.now() - state.t0) / 1000);
    var el = document.getElementById("timer");
    if (el) { el.outerHTML = timerHtml(); }
  }, 250);
}
function stopTimer() { clearInterval(state.tick); }

function renderIntro() {
  app.innerHTML =
    '<div class="top"><div><p class="eyebrow">Hackathon ISAC 2026 · Club América</p><h1>Coach Drills</h1></div></div>' +
    '<div class="card"><p class="situation">Cuatro decisiones de banca, cada una con datos reales de André Jardine en América. Cada vez que pulsas Comenzar se sortean cuatro de 12 escenarios reales: elige, mira qué respalda la evidencia y compárala con lo que pasó.</p>' +
    '<ul class="list"><li><b>Descanso:</b> qué dice el modelo predictivo.</li><li><b>Gol en contra:</b> qué dice el análisis causal.</li><li><b>Balón parado:</b> qué dicen los patrones de córner.</li><li><b>Expulsión:</b> cómo reacciona Jardine cuando se queda con diez o cuando el rival se queda con diez.</li></ul>' +
    '<p class="note">Meta: terminar las cuatro en 240 segundos. Puedes responder con las teclas 1, 2 y 3. El cronómetro empieza al pulsar Comenzar.</p>' +
    '<button class="btn" id="go">Comenzar</button></div>' +
    '<p class="foot">Datos: StatsBomb, 129 partidos de América con Jardine (2023-2026). Modelo y análisis en los notebooks 08 y 09.</p>';
  document.getElementById("go").onclick = function () { pickRun(); state.i = 0; state.answers = []; state.elapsed = 0; startTimer(); renderDrill(); };
}

function renderDrill() {
  var d = DRILLS[state.i];
  var h = '<div class="top"><div><p class="eyebrow">Decisión ' + (state.i + 1) + ' de ' + DRILLS.length + ' · ' + d.tag + '</p><h2>' + d.title + '</h2></div>' + timerHtml() + '</div>' + steps();
  h += '<div class="card"><p class="situation">' + d.sit + '</p><div class="stats">';
  d.stats.forEach(function (s) { h += '<div class="stat"><span>' + s[0] + '</span><b>' + s[1] + '</b></div>'; });
  h += '</div>' + (d.statsNote ? '<p class="note">' + d.statsNote + '</p>' : '') + (d.ctx ? '<div class="ctx"><h3>Contexto y momentum</h3><div class="tw">' + d.ctx.table + '</div><p class="note">' + d.ctx.note + '</p></div>' : '') + '<p class="question">' + d.q + '</p><div class="opts" id="opts">';
  d.opts.forEach(function (o, k) { h += '<button class="opt" data-k="' + k + '"><kbd>' + (k + 1) + '</kbd><span>' + o.t + '</span></button>'; });
  h += '</div><div class="reveal" id="reveal" hidden></div></div>';
  app.innerHTML = h;
  state.locked = false;
  document.querySelectorAll(".opt").forEach(function (b) { b.onclick = function () { choose(+b.dataset.k); }; });
}

function choose(k) {
  if (state.locked) return;
  state.locked = true;
  var d = DRILLS[state.i], o = d.opts[k];
  state.answers.push({ i: state.i, k: k, v: o.v });
  document.querySelectorAll(".opt").forEach(function (b) { b.disabled = true; if (+b.dataset.k === k) b.classList.add("picked"); });
  var label = { ok: "Respaldada por los datos", sin: "Sin respaldo en los datos", no: "Los datos no la respaldan" }[o.v];
  var last = state.i === DRILLS.length - 1;
  var r = document.getElementById("reveal");
  r.innerHTML = '<span class="verdict ' + o.v + '">' + label + '</span><p>' + o.why + '</p>' + d.evidence() +
    '<button class="btn" id="next">' + (last ? "Ver resultado" : "Siguiente decisión") + '</button>';
  r.hidden = false;
  document.getElementById("next").onclick = function () { if (last) { stopTimer(); renderEnd(); } else { state.i++; renderDrill(); window.scrollTo(0, 0); } };
  document.getElementById("next").focus({ preventScroll: true });
  r.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function renderEnd() {
  var ok = state.answers.filter(function (a) { return a.v === "ok"; }).length;
  var sin = state.answers.filter(function (a) { return a.v === "sin"; }).length;
  var inTime = state.elapsed <= LIMIT;
  app.innerHTML =
    '<div class="top"><div><p class="eyebrow">Resultado</p><h2>Tus cuatro decisiones</h2></div></div>' +
    '<div class="card"><div class="sum-grid"><div class="stat"><span>Respaldadas por datos</span><b>' + ok + ' de ' + DRILLS.length + '</b></div>' +
    '<div class="stat"><span>Sin respaldo disponible</span><b>' + sin + '</b></div>' +
    '<div class="stat"><span>Tiempo</span><b>' + fmt(state.elapsed) + (inTime ? '' : ' (pasó de ' + fmt(LIMIT) + ')') + '</b></div></div>' +
    '<div class="block"><h3>Qué muestra esta herramienta</h3><ul class="list">' +
    '<li>El modelo al descanso sí ordena los partidos por riesgo, pero no prueba que un ajuste funcione.</li>' +
    '<li>Reaccionar rápido a un gol en contra no tiene efecto demostrable sobre anotar pronto: es un resultado nulo, reportado con su incertidumbre.</li>' +
    '<li>El córner es el balón parado más productivo de América, también para el rival.</li><li>Con diez jugadores, América se repliega y con un jugador más controla el balón: los datos describen el patrón, no prueban que sea lo mejor.</li></ul></div>' +
    '<div class="block"><h3>Qué no puede decirte</h3><p class="note">Un partido no valida una regla. Los análisis usan 129 partidos de un solo entrenador, y el modelo se probó con 38. Úsalo para ordenar la discusión del cuerpo técnico, no para reemplazarla.</p></div>' +
    '<button class="btn ghost" id="again">Repetir con otros escenarios</button></div>';
  document.getElementById("again").onclick = function () { pickRun(); state.i = 0; state.answers = []; state.elapsed = 0; startTimer(); renderDrill(); window.scrollTo(0, 0); };
}

document.addEventListener("keydown", function (e) {
  if (state.i < 0 || state.locked) return;
  var n = parseInt(e.key, 10);
  if (n >= 1 && n <= 3 && document.getElementById("opts")) choose(n - 1);
});
renderIntro();
</script>
